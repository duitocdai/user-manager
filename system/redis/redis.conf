#giới hạn bộ nhớ tối đa trên ram
maxmemory 256mb

#least recently used: khi bộ nhớ đạt 256mb, redis sẽ xóa key nào có ttl(time to live)-thời gian sống của 1 key tính bằng giây
maxmemory-policy volatile-lru

#bật persistence (RDB) để lưu dữ liệu
#lưu sau 900s nếu chỉ có 1 thay đổi
save 900 1
#lưu sau 300s nếu chỉ có 10 thay đổi
save 300 10 
#lưu sau 60s nếu chỉ có 10000 thay đổi
save 60 10000

dir /data